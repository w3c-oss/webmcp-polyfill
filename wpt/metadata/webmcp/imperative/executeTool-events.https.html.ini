# The first case requires isTrusted, which script-dispatched events cannot have
# (https://dom.spec.whatwg.org/#dom-event-istrusted). The second expects a raw string result;
# the polyfill JSON-serializes results. The third aborts before the dispatch task, which skips
# the callback, so no toolcancel fires and the test waits for it until it times out.
[executeTool-events.https.html]
  expected: TIMEOUT
  [toolactivated and toolcancel events are dispatched on document.modelContext during tool execution and cancellation]
    expected: FAIL
  [toolactivated is dispatched at the ModelContext of the tool target document]
    expected: FAIL
  [toolcancel is dispatched at the ModelContext of the tool target document]
    expected: TIMEOUT
