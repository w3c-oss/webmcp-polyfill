# The first case expects an opaque-origin document to execute its own tool. The draft still
# rejects that with NotSupportedError (webmcp#349); Chromium allows it since WPT 3dad33b. The
# other cases run in sandboxed srcdoc iframes and a popup's about:blank document, where WPT
# injection does not install the polyfill.
[opaque-origin-tools.https.html]
  [An opaque origin document can register and execute its own tools]
    expected: FAIL
  [A document inside a sandboxed (opaque) iframe can execute its own tool]
    expected: FAIL
  [An opaque-origin srcdoc child can register and execute its own tool]
    expected: FAIL
  [Two Documents sharing a copied opaque origin can see and execute each other's tools]
    expected: FAIL
  [A document with a different opaque origin cannot obtain or execute the tool]
    expected: FAIL
