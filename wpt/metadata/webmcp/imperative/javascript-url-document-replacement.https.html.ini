# The replacement document comes from a javascript: URL rather than the WPT server, so WPT
# injection cannot install the polyfill in it. Its registerTool() call throws before it posts a
# message, and the test waits for that message until it times out.
[javascript-url-document-replacement.https.html]
  expected: TIMEOUT
  [A document that replaces another via a javascript: URL can register tools]
    expected: TIMEOUT
